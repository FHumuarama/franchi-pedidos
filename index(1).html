<header class="header"><a class="brand" href="/" data-route="/"><span class="brand-symbol">F</span><span><strong>FRANCHI <em>PEDIDOS</em></strong><small>by Franchi Creative</small></span></a><div class="header-actions"><a class="subtle-link" href="/" data-route="/">Lojas</a><button class="cart-button" id="cartTop" type="button" hidden>🛒 <span id="cartCount">0</span></button></div></header>
<main class="container" id="main" aria-live="polite"><section class="loading" id="carregamentoInicial" style="padding:50px 10px;text-align:center"><h2>Carregando lojas...</h2><p>Preparando o catálogo Franchi Pedidos.</p></section></main>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Janela de informações"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
window.addEventListener('load',()=>setTimeout(()=>{
  const area=document.getElementById('main');
  const inicial=document.getElementById('carregamentoInicial');
  if(area && inicial && area.contains(inicial)){
    inicial.innerHTML='<h2>Não foi possível abrir o catálogo.</h2><p>O aplicativo não carregou completamente. Verifique sua internet e atualize a página. Se continuar, entre em contato com o suporte da Franchi Creative.</p><button type="button" onclick="location.reload()" style="border:0;border-radius:12px;padding:12px 20px;background:#b78a40;color:#121212;font-weight:bold">Tentar novamente</button>';
  }
},8000));
</script>
